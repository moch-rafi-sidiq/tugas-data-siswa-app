<!DOCTYPE html>
<html lang="id">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <meta http-equiv="Cache-Control" content="no-cache, no-store, must-revalidate" />
  <meta http-equiv="Pragma" content="no-cache" />
  <meta http-equiv="Expires" content="0" />
  <title>Data Siswa - Web Aplikasi Simpel</title>
  <script src="https://cdn.tailwindcss.com"></script>
</head>
<body class="bg-slate-100 min-h-screen font-sans">

  <!-- Header -->
  <header class="bg-gradient-to-r from-blue-600 to-indigo-600 text-white shadow">
    <div class="max-w-4xl mx-auto px-4 py-6 flex items-center justify-between">
      <div>
        <h1 class="text-2xl font-bold flex items-center gap-2">
          <svg xmlns="http://www.w3.org/2000/svg" fill="none" viewBox="0 0 24 24" stroke-width="1.5" stroke="currentColor" class="w-7 h-7"><path stroke-linecap="round" stroke-linejoin="round" d="M4.26 10.147a60.436 60.436 0 00-.491 6.347A48.627 48.627 0 0112 20.904a48.627 48.627 0 018.232-4.41 60.46 60.46 0 00-.491-6.347m-15.482 0a50.57 50.57 0 00-2.658-.813A59.905 59.905 0 0112 3.493a59.902 59.902 0 0110.399 5.84c-.896.248-1.783.52-2.658.814m-15.482 0A50.697 50.697 0 0112 13.489a50.702 50.702 0 017.74-3.342M6.75 15a.75.75 0 100-1.5.75.75 0 000 1.5zm0 0v-3.675A55.378 55.378 0 0112 8.443m-7.007 11.55A5.981 5.981 0 006.75 15.75v-1.5" /></svg>
          Data Siswa
        </h1>
      </div>
      <div class="bg-white/20 rounded-full px-4 py-2 text-sm font-semibold">
        Total: <span id="totalBadge">0</span> siswa
      </div>
    </div>
  </header>

  <main class="max-w-4xl mx-auto px-4 py-6 space-y-6">

    <!-- Form -->
    <section class="bg-white rounded-xl shadow p-5">
      <h2 id="formTitle" class="text-lg font-bold mb-4">Tambah Data Siswa</h2>
      <form id="formSiswa" class="grid md:grid-cols-3 gap-3">
        <div>
          <label class="text-sm font-medium text-slate-600">Nama Lengkap</label>
          <input id="inputNama" type="text" placeholder="cth: Budi Santoso"
            class="mt-1 w-full border rounded-lg px-3 py-2 focus:outline-none focus:ring-2 focus:ring-blue-500" />
        </div>
        <div>
          <label class="text-sm font-medium text-slate-600">NIM</label>
          <input id="inputNim" type="text" placeholder="cth: 2024001"
            class="mt-1 w-full border rounded-lg px-3 py-2 focus:outline-none focus:ring-2 focus:ring-blue-500" />
        </div>
        <div>
          <label class="text-sm font-medium text-slate-600">Jurusan</label>
          <select id="inputJurusan"
            class="mt-1 w-full border rounded-lg px-3 py-2 bg-white focus:outline-none focus:ring-2 focus:ring-blue-500">
            <option value="">-- Pilih --</option>
            <option>Informatika</option>
            <option>Sistem Informasi</option>
            <option>Teknik Elektro</option>
            <option>Manajemen</option>
            <option>Akuntansi</option>
          </select>
        </div>
      </form>
      <p id="errorMsg" class="hidden mt-3 text-sm text-red-600 bg-red-50 border border-red-200 rounded-lg px-3 py-2"></p>
      <div class="mt-4 flex gap-2">
        <button id="btnSimpan"
          class="bg-blue-600 hover:bg-blue-700 text-white font-semibold px-5 py-2 rounded-lg transition">
          Tambah
        </button>
        <button id="btnBatal" class="hidden bg-slate-200 hover:bg-slate-300 text-slate-700 font-semibold px-5 py-2 rounded-lg transition">
          Batal Edit
        </button>
      </div>
    </section>

    <!-- Search + Tabel -->
    <section class="bg-white rounded-xl shadow p-5">
      <div class="flex flex-col md:flex-row md:items-center gap-3 mb-4">
        <h2 class="text-lg font-bold flex-1">Daftar Siswa</h2>
        <div class="relative w-full md:w-72">
          <svg xmlns="http://www.w3.org/2000/svg" fill="none" viewBox="0 0 24 24" stroke-width="1.5" stroke="currentColor" class="w-5 h-5 absolute left-3 top-1/2 -translate-y-1/2 text-slate-400 pointer-events-none"><path stroke-linecap="round" stroke-linejoin="round" d="M21 21l-5.197-5.197m0 0A7.5 7.5 0 105.196 5.196a7.5 7.5 0 0010.607 10.607z" /></svg>
          <input id="inputCari" type="text" placeholder="Cari nama / NIM / jurusan..."
            class="border rounded-lg pl-10 pr-3 py-2 w-full focus:outline-none focus:ring-2 focus:ring-blue-500" />
        </div>
      </div>

      <div class="overflow-x-auto">
        <table class="w-full text-sm">
          <thead>
            <tr class="bg-slate-100 text-slate-600 text-left">
              <th class="px-3 py-2 rounded-l-lg w-12">No</th>
              <th class="px-3 py-2">Nama</th>
              <th class="px-3 py-2">NIM</th>
              <th class="px-3 py-2">Jurusan</th>
              <th class="px-3 py-2 rounded-r-lg text-center w-40">Aksi</th>
            </tr>
          </thead>
          <tbody id="tbodyData"></tbody>
        </table>
      </div>

      <div id="emptyState" class="text-center py-10 text-slate-400">
        <svg xmlns="http://www.w3.org/2000/svg" fill="none" viewBox="0 0 24 24" stroke-width="1.5" stroke="currentColor" class="w-12 h-12 mx-auto mb-2 text-slate-300"><path stroke-linecap="round" stroke-linejoin="round" d="M20.25 7.5l-.625 10.632a2.25 2.25 0 01-2.247 2.118H6.622a2.25 2.25 0 01-2.247-2.118L3.75 7.5m6 4.125l2.25 2.25m0 0l2.25 2.25M12 13.875l2.25-2.25M12 13.875l-2.25 2.25M3.375 7.5h17.25c.621 0 1.125-.504 1.125-1.125v-1.5c0-.621-.504-1.125-1.125-1.125H3.375c-.621 0-1.125.504-1.125 1.125v1.5c0 .621.504 1.125 1.125 1.125z" /></svg>
        <p>Belum ada data. Tambahkan data pertama kamu di atas!</p>
      </div>
    </section>

    <p class="text-center text-xs text-slate-400 pb-6">Data tersimpan otomatis di browser (localStorage)</p>
  </main>

  <script src="app.js"></script>
</body>
</html>
